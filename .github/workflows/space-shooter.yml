name: Space Shooter

on:
  schedule:
    - cron: "17 5 * * *"   # todos los días
  workflow_dispatch:        # botón "Run workflow" manual
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar nave 🚀
        run: node scripts/generate.mjs --user ${{ github.repository_owner }} --style ship --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar tanque 🪖
        run: node scripts/generate.mjs --user ${{ github.repository_owner }} --style tank --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
